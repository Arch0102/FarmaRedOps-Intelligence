services:
  postgres:
    image: postgres:16-alpine
    container_name: farmared-postgres
    environment:
      POSTGRES_DB: farmared_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Farmared123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farmared_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmared-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/farmared_db
      DB_USER: postgres
      DB_PASSWORD: Farmared123
      SERVER_PORT: 8080
      JWT_SECRET: farmared_dev_jwt_secret_12345678901234567890
      JWT_EXPIRATION_MS: 3600000
      DOCUMENT_STORAGE_PATH: /app/uploads/documentos
      DOCUMENT_MAX_SIZE_BYTES: 10485760
    ports:
      - "8080:8080"
    volumes:
      - document-storage:/app/uploads

volumes:
  postgres-data:
  document-storage:
