services:
  postgres:
    image: postgres:17-alpine
    container_name: farmared-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: farmared_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Farmared123
    ports:
      - "5433:5432"
    volumes:
      - farmared_postgres_data:/var/lib/postgresql/data
    networks:
      - farmared-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farmared_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmared-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/farmared_db
      DB_USER: postgres
      DB_PASSWORD: Farmared123
      JWT_SECRET: clave_jwt_de_desarrollo_con_minimo_32_caracteres
      JWT_EXPIRATION_MS: 3600000
    ports:
      - "8081:8080"
    networks:
      - farmared-network

volumes:
  farmared_postgres_data:

networks:
  farmared-network:
    driver: bridge